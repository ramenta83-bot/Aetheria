<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheria Web MUD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="mud-shell">
    <header class="mud-header">
      <div class="brand-title">AETHERIA // REAL-TIME MULTIPLAYER MUD</div>
      <div id="conn-status" class="conn-badge disconnected">DISCONNECTED</div>
    </header>

    <section class="vitals-bar" aria-label="Character Vitals">
      <div class="vital-item">
        <span class="vital-label">CLASS</span>
        <span id="hud-class" class="vital-value">--</span>
      </div>
      <div class="vital-item">
        <span class="vital-label">RANK</span>
        <span id="hud-rank" class="vital-value">1</span>
      </div>
      <div class="vital-item">
        <span class="vital-label">HP</span>
        <span id="hud-hp" class="vital-value">100/100</span>
      </div>
      <div class="vital-item">
        <span class="vital-label">RESOURCE</span>
        <span id="hud-res" class="vital-value">100/100</span>
      </div>
      <div class="vital-item">
        <span class="vital-label">KRONARS</span>
        <span id="hud-gold" class="vital-value">50</span>
      </div>
      <div class="vital-item">
        <span class="vital-label">RECOVERY</span>
        <span id="hud-rt" class="vital-value ready">READY</span>
      </div>
    </section>

    <section class="stage-container" aria-label="Visual ASCII Stages">
      <pre id="ambient-stage" class="ambient-stage" aria-hidden="true"></pre>
      <pre id="ascii-stage" class="ascii-stage" aria-hidden="true"></pre>
    </section>

    <main id="terminal-output" class="terminal-output" role="log" aria-live="polite"></main>

    <form id="command-form" class="command-bar" autocomplete="off">
      <span class="prompt-glyph">&gt;</span>
      <input
        id="command-input"
        type="text"
        placeholder="Enter command (e.g., look, north, attune chaos bolt, strike rat, train, shop)..."
        autofocus
      />
      <button type="submit" class="send-btn">SEND</button>
    </form>
  </div>

  <script src="animations.js"></script>
  <script src="client.js"></script>
</body>
</html>
